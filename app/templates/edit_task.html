{% extends "base.html" %}

{% block title %}Edit Task{% endblock %}

{% block content %}
<section class="form-container">
    <h1>Edit Task</h1>
    
    <form id="edit-task-form" action="/tasks/{{ task.id }}/edit" method="post">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" value="{{ task.title }}" required>
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" required>{{ task.description }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="due_date">Due Date</label>
            <input type="date" id="due_date" name="due_date" value="{{ task.due_date }}" required>
        </div>
        
        <div class="form-group">
            <label for="priority">Priority</label>
            <select id="priority" name="priority" required>
                <option value="high" {% if task.priority == 'high' %}selected{% endif %}>High</option>
                <option value="medium" {% if task.priority == 'medium' %}selected{% endif %}>Medium</option>
                <option value="low" {% if task.priority == 'low' %}selected{% endif %}>Low</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status" required>
                <option value="new" {% if task.status == 'new' %}selected{% endif %}>New</option>
                <option value="in_progress" {% if task.status == 'in_progress' %}selected{% endif %}>In Progress</option>
                <option value="completed" {% if task.status == 'completed' %}selected{% endif %}>Completed</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="assignee">Assignee</label>
            <input type="text" id="assignee" name="assignee" value="{{ task.assignee }}" required>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Task</button>
            <a href="/tasks/{{ task.id }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('edit-task-form');
        
        form.addEventListener('submit', function(e) {
            // Basic form validation
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            
            if (title === '') {
                e.preventDefault();
                alert('Please enter a task title');
                return;
            }
            
            if (description === '') {
                e.preventDefault();
                alert('Please enter a task description');
                return;
            }
        });
    });
</script>
{% endblock %}
